<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roller Club</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 20px;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
        }

        .titre {
            font-size: 22px;
            font-weight: bold;
        }

        .profil {
            margin-top: 5px;
            font-size: 14px;
            opacity: .85;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        #login {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .12);
            text-align: center;
        }

        .login-box h1 {
            margin-top: 0;
        }

        .login-box input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .btn-login {
            width: 100%;
            background: #222;
            color: white;
        }

        .btn-login:hover {
            background: #444;
        }

        #loginErreur {
            color: #c62828;
            margin-top: 15px;
            min-height: 20px;
        }

        #app {
            display: none;
        }

        .barre-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .btn-deconnexion {
            background: #ddd;
            color: #222;
            font-size: 14px;
        }

        .jour {
            margin-bottom: 25px;
        }

        .jour-titre {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            padding-left: 5px;
        }

        .creneau-card {
            background: white;
            border-radius: 12px;
            margin-bottom: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
            cursor: pointer;
            transition: transform .1s;
        }

        .creneau-card:hover {
            transform: translateY(-1px);
        }

        .creneau-haut {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .heure {
            font-size: 19px;
            font-weight: bold;
        }

        .nb {
            font-size: 13px;
            color: #777;
        }

        .entraineurs {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 12px;
        }

        .bulle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
        }

        .bulle.moi {
            background: #1976d2;
            box-shadow: 0 0 0 3px #bbdefb;
        }

        .aucun {
            color: #aaa;
            font-size: 14px;
            font-style: italic;
        }

        .chargement {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }

        .erreur {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        #modalFond {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 100;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
        }

        .modal h2 {
            margin-top: 0;
        }

        .modal-info {
            color: #666;
            margin-bottom: 20px;
        }

        .liste-entraineurs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .modal-bulle {
            padding: 8px 12px;
            border-radius: 20px;
            background: #eee;
            font-size: 14px;
            font-weight: bold;
        }

        .modal-bulle.moi {
            background: #1976d2;
            color: white;
        }

        .boutons {
            display: flex;
            gap: 10px;
        }

        .boutons button {
            flex: 1;
        }

        .btn-present {
            background: #2e7d32;
            color: white;
        }

        .btn-absent {
            background: #c62828;
            color: white;
        }

        .btn-fermer {
            width: 100%;
            margin-top: 10px;
            background: #ddd;
        }

        @media (max-width: 500px) {
            .container {
                padding: 12px;
            }

            header {
                padding: 15px;
            }

            .creneau-card {
                padding: 13px;
            }

            .boutons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div id="login">
        <div class="login-box">
            <h1>🛼 Roller Club V1</h1>

            <p>Entrez votre mot de passe</p>

            <input
                type="password"
                id="motDePasse"
                placeholder="Mot de passe"
                autocomplete="off"
            >

            <button
                id="btnConnexion"
                class="btn-login"
                type="button"
            >
                Se connecter
            </button>

            <div id="loginErreur"></div>
        </div>
    </div>

    <div id="app">
        <header>
            <div class="titre">🛼 Roller Club</div>
            <div class="profil" id="profil"></div>
        </header>

        <div class="container">
            <div class="barre-actions">
                <strong>Entraînements</strong>

                <button
                    id="btnDeconnexion"
                    class="btn-deconnexion"
                    type="button"
                >
                    Déconnexion
                </button>
            </div>

            <div id="message"></div>

            <div id="contenu">
                <div class="chargement">
                    Chargement...
                </div>
            </div>
        </div>
    </div>

    <div id="modalFond">
        <div class="modal">
            <h2 id="modalTitre"></h2>

            <div
                class="modal-info"
                id="modalInfo"
            ></div>

            <strong>Entraîneurs :</strong>

            <div
                class="liste-entraineurs"
                id="modalEntraineurs"
            ></div>

            <div class="boutons">
                <button
                    id="btnPresent"
                    class="btn-present"
                    type="button"
                >
                    ✓ Je suis présent
                </button>

                <button
                    id="btnAbsent"
                    class="btn-absent"
                    type="button"
                >
                    ✕ Je suis absent
                </button>
            </div>

            <button
                id="btnFermer"
                class="btn-fermer"
                type="button"
            >
                Fermer
            </button>
        </div>
    </div>

    <script>
        /*
         * Configuration Supabase pour une page HTML utilisant le CDN.
         *
         * Utilisez une clé Publishable ou anon.
         * Ne mettez jamais une clé service_role ici.
         */

        const SUPABASE_URL =
            "https://vmvwilwltepayklrwmci.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_RQSXS9X7Eraijaa8DdKT8g_bShmscFT";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        let entraineurConnecte = null;
        let entraineurs = [];
        let entrainements = [];
        let creneauActif = null;


        document.addEventListener(
            "DOMContentLoaded",
            async function () {
                document
                    .getElementById("btnConnexion")
                    .addEventListener(
                        "click",
                        connexion
                    );

                document
                    .getElementById("btnDeconnexion")
                    .addEventListener(
                        "click",
                        deconnexion
                    );

                document
                    .getElementById("btnPresent")
                    .addEventListener(
                        "click",
                        function () {
                            modifierPresence(true);
                        }
                    );

                document
                    .getElementById("btnAbsent")
                    .addEventListener(
                        "click",
                        function () {
                            modifierPresence(false);
                        }
                    );

                document
                    .getElementById("btnFermer")
                    .addEventListener(
                        "click",
                        fermerModal
                    );

                document
                    .getElementById("motDePasse")
                    .addEventListener(
                        "keydown",
                        function (event) {
                            if (event.key === "Enter") {
                                connexion();
                            }
                        }
                    );

                document
                    .getElementById("modalFond")
                    .addEventListener(
                        "click",
                        function (event) {
                            if (event.target === this) {
                                fermerModal();
                            }
                        }
                    );


                const sauvegarde =
                    localStorage.getItem(
                        "roller_entraineur"
                    );

                if (!sauvegarde) {
                    afficherLogin();
                    return;
                }

                try {
                    entraineurConnecte =
                        JSON.parse(sauvegarde);

                    if (
                        !entraineurConnecte ||
                        !entraineurConnecte.id
                    ) {
                        throw new Error(
                            "Session locale invalide"
                        );
                    }

                    await chargerApplication();
                } catch (error) {
                    console.error(error);

                    localStorage.removeItem(
                        "roller_entraineur"
                    );

                    entraineurConnecte = null;

                    afficherLogin();
                }
            }
        );


        function afficherLogin() {
            document
                .getElementById("login")
                .style.display = "flex";

            document
                .getElementById("app")
                .style.display = "none";
        }


        async function connexion() {
            const input =
                document.getElementById(
                    "motDePasse"
                );

            const erreur =
                document.getElementById(
                    "loginErreur"
                );

            const bouton =
                document.getElementById(
                    "btnConnexion"
                );

            const mdp =
                input.value.trim();

            erreur.textContent = "";

            if (!mdp) {
                erreur.textContent =
                    "Veuillez entrer votre mot de passe.";

                return;
            }

            bouton.disabled = true;
            bouton.textContent = "Connexion...";

            try {
                /*
                 * La colonne MdP est utilisée uniquement
                 * pour rechercher l'entraîneur connecté.
                 */
                const resultat =
                    await supabaseClient
                        .from("Entraineur")
                        .select(
                            "id,Nom,Mail,MdP,Pseudo"
                        )
                        .eq(
                            "MdP",
                            mdp
                        )
                        .maybeSingle();

                if (resultat.error) {
                    console.error(
                        "Erreur Supabase lors de la connexion :",
                        resultat.error
                    );

                    throw resultat.error;
                }

                if (!resultat.data) {
                    erreur.textContent =
                        "Mot de passe incorrect.";

                    return;
                }

                entraineurConnecte =
                    resultat.data;

                localStorage.setItem(
                    "roller_entraineur",
                    JSON.stringify(
                        entraineurConnecte
                    )
                );

                input.value = "";

                await chargerApplication();

            } catch (error) {
                console.error(
                    "Erreur de connexion :",
                    error
                );

                erreur.textContent =
                    error.message ||
                    "Impossible de contacter Supabase.";

            } finally {
                bouton.disabled = false;
                bouton.textContent = "Se connecter";
            }
        }


        async function chargerApplication() {
            document
                .getElementById("login")
                .style.display = "none";

            document
                .getElementById("app")
                .style.display = "block";

            document
                .getElementById("profil")
                .textContent =
                    "Connecté : " +
                    (
                        entraineurConnecte.Pseudo ||
                        entraineurConnecte.Nom ||
                        entraineurConnecte.id
                    );

            document
                .getElementById("contenu")
                .innerHTML =
                    `
                    <div class="chargement">
                        Chargement...
                    </div>
                    `;

            try {
                /*
                 * Ne pas charger MdP ici.
                 * Il est inutile pour afficher les entraîneurs.
                 */
                const resultatEntraineurs =
                    await supabaseClient
                        .from("Entraineur")
                        .select(
                            "id,Nom,Mail,Pseudo"
                        )
                        .order("id");

                if (resultatEntraineurs.error) {
                    throw resultatEntraineurs.error;
                }

                entraineurs =
                    resultatEntraineurs.data || [];


                const resultatEntrainements =
                    await supabaseClient
                        .from("Entrainement")
                        .select(
                            'id,Date,"Créneau",Entraineur'
                        )
                        .order("Date")
                        .order("Créneau");

                if (resultatEntrainements.error) {
                    throw resultatEntrainements.error;
                }

                entrainements =
                    resultatEntrainements.data || [];

                afficherCreneaux();

            } catch (error) {
                console.error(
                    "Erreur de chargement :",
                    error
                );

                document
                    .getElementById("contenu")
                    .innerHTML =
                    `
                    <div class="erreur">
                        <strong>
                            Erreur de chargement
                        </strong>

                        <br><br>

                        ${esc(
                            error.message ||
                            "Erreur inconnue"
                        )}
                    </div>
                    `;
            }
        }


        function afficherCreneaux() {
            const contenu =
                document.getElementById(
                    "contenu"
                );

            if (!entrainements.length) {
                contenu.innerHTML =
                    `
                    <div class="chargement">
                        Aucun entraînement trouvé
                        dans la table Entrainement.
                    </div>
                    `;

                return;
            }


            const groupes = new Map();

            entrainements.forEach(
                function (row) {
                    const date =
                        String(
                            row.Date ?? ""
                        ).trim();

                    const creneau =
                        String(
                            row["Créneau"] ?? ""
                        ).trim();

                    const cle =
                        date +
                        "||" +
                        creneau;

                    if (!groupes.has(cle)) {
                        groupes.set(
                            cle,
                            {
                                date: date,
                                creneau: creneau,
                                lignes: []
                            }
                        );
                    }

                    groupes
                        .get(cle)
                        .lignes
                        .push(row);
                }
            );


            const liste =
                Array.from(
                    groupes.values()
                );

            liste.sort(
                function (a, b) {
                    const dateA =
                        dateComparable(a.date);

                    const dateB =
                        dateComparable(b.date);

                    if (dateA !== dateB) {
                        return dateA - dateB;
                    }

                    return a.creneau.localeCompare(
                        b.creneau,
                        "fr",
                        {
                            numeric: true
                        }
                    );
                }
            );


            const jours = new Map();

            liste.forEach(
                function (creneau) {
                    if (!jours.has(creneau.date)) {
                        jours.set(
                            creneau.date,
                            []
                        );
                    }

                    jours
                        .get(creneau.date)
                        .push(creneau);
                }
            );


            let html = "";

            jours.forEach(
                function (creneaux, date) {
                    html +=
                        `
                        <div class="jour">
                            <div class="jour-titre">
                                ${esc(formatDate(date))}
                            </div>
                        `;

                    creneaux.forEach(
                        function (creneau) {
                            const ids =
                                creneau.lignes.map(
                                    function (row) {
                                        return String(
                                            row.Entraineur
                                        );
                                    }
                                );

                            const idsUniques =
                                [
                                    ...new Set(ids)
                                ];

                            let bulles = "";

                            if (!idsUniques.length) {
                                bulles =
                                    `
                                    <span class="aucun">
                                        Aucun entraîneur
                                    </span>
                                    `;
                            } else {
                                bulles =
                                    idsUniques
                                        .map(
                                            function (id) {
                                                return `
                                                <div
                                                    class="bulle ${
                                                        estMoi(id)
                                                            ? "moi"
                                                            : ""
                                                    }"
                                                    title="Entraîneur ${esc(id)}"
                                                >
                                                    ${esc(id)}
                                                </div>
                                                `;
                                            }
                                        )
                                        .join("");
                            }

                            html +=
                                `
                                <div
                                    class="creneau-card"
                                    data-date="${esc(creneau.date)}"
                                    data-creneau="${esc(creneau.creneau)}"
                                >
                                    <div class="creneau-haut">
                                        <div class="heure">
                                            ${esc(creneau.creneau)}
                                        </div>

                                        <div class="nb">
                                            ${idsUniques.length}
                                            entraîneur${
                                                idsUniques.length > 1
                                                    ? "s"
                                                    : ""
                                            }
                                        </div>
                                    </div>

                                    <div class="entraineurs">
                                        ${bulles}
                                    </div>
                                </div>
                                `;
                        }
                    );

                    html += "</div>";
                }
            );

            contenu.innerHTML = html;


            document
                .querySelectorAll(".creneau-card")
                .forEach(
                    function (card) {
                        card.addEventListener(
                            "click",
                            function () {
                                const date =
                                    card.dataset.date;

                                const creneau =
                                    card.dataset.creneau;

                                const groupe =
                                    groupes.get(
                                        date +
                                        "||" +
                                        creneau
                                    );

                                if (groupe) {
                                    ouvrirCreneau(groupe);
                                }
                            }
                        );
                    }
                );
        }


        function ouvrirCreneau(creneau) {
            creneauActif =
                creneau;

            document
                .getElementById("modalTitre")
                .textContent =
                    creneau.creneau;

            document
                .getElementById("modalInfo")
                .textContent =
                    formatDate(creneau.date);


            const ids =
                creneau.lignes.map(
                    function (row) {
                        return String(
                            row.Entraineur
                        );
                    }
                );

            const idsUniques =
                [
                    ...new Set(ids)
                ];

            const zone =
                document.getElementById(
                    "modalEntraineurs"
                );

            if (!idsUniques.length) {
                zone.innerHTML =
                    `
                    <span class="aucun">
                        Aucun entraîneur inscrit
                    </span>
                    `;
            } else {
                zone.innerHTML =
                    idsUniques
                        .map(
                            function (id) {
                                return `
                                <div
                                    class="modal-bulle ${
                                        estMoi(id)
                                            ? "moi"
                                            : ""
                                    }"
                                >
                                    ${esc(id)}
                                    ${
                                        estMoi(id)
                                            ? " (moi)"
                                            : ""
                                    }
                                </div>
                                `;
                            }
                        )
                        .join("");
            }

            document
                .getElementById("modalFond")
                .style.display = "flex";
        }


        async function modifierPresence(present) {
            if (
                !creneauActif ||
                !entraineurConnecte
            ) {
                return;
            }

            const idEntraineur =
                entraineurConnecte.id;

            const lignesMoi =
                creneauActif.lignes.filter(
                    function (row) {
                        return String(
                            row.Entraineur
                        ) === String(
                            idEntraineur
                        );
                    }
                );

            const boutonPresent =
                document.getElementById(
                    "btnPresent"
                );

            const boutonAbsent =
                document.getElementById(
                    "btnAbsent"
                );

            boutonPresent.disabled = true;
            boutonAbsent.disabled = true;

            try {
                if (present) {
                    if (!lignesMoi.length) {
                        const resultat =
                            await supabaseClient
                                .from("Entrainement")
                                .insert({
                                    Date:
                                        creneauActif.date,

                                    "Créneau":
                                        creneauActif.creneau,

                                    Entraineur:
                                        idEntraineur
                                });

                        if (resultat.error) {
                            throw resultat.error;
                        }
                    }
                } else {
                    if (lignesMoi.length) {
                        const ids =
                            lignesMoi.map(
                                function (row) {
                                    return row.id;
                                }
                            );

                        const resultat =
                            await supabaseClient
                                .from("Entrainement")
                                .delete()
                                .in("id", ids);

                        if (resultat.error) {
                            throw resultat.error;
                        }
                    }
                }

                fermerModal();

                await chargerApplication();

            } catch (error) {
                console.error(
                    "Erreur lors de la modification :",
                    error
                );

                alert(
                    "Erreur lors de la modification :\n\n" +
                    (
                        error.message ||
                        "Erreur inconnue"
                    )
                );

            } finally {
                boutonPresent.disabled = false;
                boutonAbsent.disabled = false;
            }
        }


        function deconnexion() {
            localStorage.removeItem(
                "roller_entraineur"
            );

            entraineurConnecte = null;
            entraineurs = [];
            entrainements = [];
            creneauActif = null;

            document
                .getElementById("app")
                .style.display = "none";

            afficherLogin();
        }


        function fermerModal() {
            document
                .getElementById("modalFond")
                .style.display = "none";

            creneauActif = null;
        }


        function estMoi(id) {
            if (!entraineurConnecte) {
                return false;
            }

            return String(id) === String(
                entraineurConnecte.id
            );
        }


        function formatDate(date) {
            if (!date) {
                return "";
            }

            const texte =
                String(date).trim();

            let correspondance =
                texte.match(
                    /^(\d{4})-(\d{2})-(\d{2})$/
                );

            if (correspondance) {
                const d =
                    new Date(
                        Number(correspondance[1]),
                        Number(correspondance[2]) - 1,
                        Number(correspondance[3])
                    );

                return d.toLocaleDateString(
                    "fr-FR",
                    {
                        weekday: "long",
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );
            }

            correspondance =
                texte.match(
                    /^(\d{2})\/(\d{2})\/(\d{4})$/
                );

            if (correspondance) {
                const d =
                    new Date(
                        Number(correspondance[3]),
                        Number(correspondance[2]) - 1,
                        Number(correspondance[1])
                    );

                return d.toLocaleDateString(
                    "fr-FR",
                    {
                        weekday: "long",
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );
            }

            return texte;
        }


        function dateComparable(date) {
            const texte =
                String(date ?? "").trim();

            let correspondance =
                texte.match(
                    /^(\d{4})-(\d{2})-(\d{2})$/
                );

            if (correspondance) {
                return new Date(
                    Number(correspondance[1]),
                    Number(correspondance[2]) - 1,
                    Number(correspondance[3])
                ).getTime();
            }

            correspondance =
                texte.match(
                    /^(\d{2})\/(\d{2})\/(\d{4})$/
                );

            if (correspondance) {
                return new Date(
                    Number(correspondance[3]),
                    Number(correspondance[2]) - 1,
                    Number(correspondance[1])
                ).getTime();
            }

            return 0;
        }


        function esc(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
    </script>
